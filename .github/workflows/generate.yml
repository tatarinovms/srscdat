name: Generate geosite.dat

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout srscdat
        uses: actions/checkout@v4
      
      - name: Checkout ShadowRocketSimpleConfig
        uses: actions/checkout@v4
        with:
          repository: tatarinovms/ShadowRocketSimpleConfig
          path: lists
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      
      - name: Clone domain-list-community
        run: git clone https://github.com/v2fly/domain-list-community.git
      
      - name: Convert lists
        run: python3 src/convert.py lists/lists/ data/
      
      - name: Generate geosite.dat
        run: |
          cd domain-list-community
          go run ./ --datapath=../data --outputname=geosite.dat --outputdir=../
          cd ..
          echo "=== Checking output ==="
          ls -la geosite.dat
          file geosite.dat
      
      - name: Check geosite.dat
        run: python3 src/check.py geosite.dat
      
      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: geosite
          name: geosite.dat
          body: "Auto-generated on ${{ github.event.repository.updated_at }}"
          files: geosite.dat
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
